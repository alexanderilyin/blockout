<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blockout prototypes</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="shared/proto.css" />
  <script>
    try {
      var saved = JSON.parse(localStorage.getItem('blockout.settings')) || {};
      if (saved.theme === 'light' || saved.theme === 'dark') document.documentElement.dataset.theme = saved.theme;
    } catch (e) {}
  </script>
</head>
<body>
  <main class="hub">
    <header class="hub-head">
      <a class="back-link" href="../index.html">← Blockout (multiplication)</a>
      <h1 class="logo">BLOCK<span>OUT</span></h1>
      <p>Concept prototypes: the same roll, place and answer loop, built for other operations. Each one has <strong>Single player</strong> (you vs the CPU) and <strong>Practice</strong> (Learn or Expert). There’s no shop, stats or saving yet.</p>
    </header>
    <div class="hub-grid" id="hub-grid"></div>
  </main>
  <script src="shared/fraction.js"></script>
  <script src="shared/boards.js"></script>
  <script src="shared/variants.js"></script>
  <script>
    (function () {
      var esc = function (t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
      var boardKind = { grid: 'Grid board', bars: 'Fraction bars' };
      var html = ProtoVariants.VARIANTS.map(function (v) {
        var kind = boardKind[v.newBoard('easy').kind];
        return '<article class="hub-card">' +
          '<h2><span class="op-badge">' + esc(v.op) + '</span> ' + esc(v.name) + '</h2>' +
          '<p class="grade">' + esc(v.title) + ' · ' + esc(v.grade) + '</p>' +
          '<p class="tag">' + esc(v.tagline) + '</p>' +
          '<p class="idea">' + esc(v.concept) + '</p>' +
          '<span class="kind">' + kind + (v.answer === 'frac' ? ' · fraction answers' : '') + '</span>' +
          '<a class="btn btn-primary" href="' + v.id + '.html">Play ›</a>' +
          '</article>';
      }).join('');
      document.getElementById('hub-grid').innerHTML = html;
    })();
  </script>
</body>
</html>
