<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Addition · Blockout prototype</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="shared/proto.css" />
  <script>
    // Same light/dark choice as the main game
    try {
      var saved = JSON.parse(localStorage.getItem('blockout.settings')) || {};
      if (saved.theme === 'light' || saved.theme === 'dark') document.documentElement.dataset.theme = saved.theme;
    } catch (e) {}
  </script>
</head>
<body data-variant="addition">
  <!-- Prototype: the page is built by shared/engine.js from the rules in shared/variants.js -->
  <script src="shared/fraction.js"></script>
  <script src="shared/boards.js"></script>
  <script src="shared/variants.js"></script>
  <script src="shared/engine.js"></script>
</body>
</html>
